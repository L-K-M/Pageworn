name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Debug build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the debug app and run the JVM tests
        run: ./gradlew --console=plain :app:assembleDebug :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pageworn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
